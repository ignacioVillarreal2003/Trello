<div class="select" [ngClass]="[appearance, color, rounded, size]">
  <label *ngIf="textLabel.length > 0" [for]="id">{{ textLabel }}</label>
  <div class="content">
    <select [ngModel]="selectedValue" (ngModelChange)="onSelectChange($event)">
      <option *ngFor="let option of options" [value]="option.value">
        {{ option.label }}
      </option>
    </select>
    <ng-content></ng-content>
  </div>
</div>
