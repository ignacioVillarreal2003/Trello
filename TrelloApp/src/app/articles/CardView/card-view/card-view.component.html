<div class="card" *ngIf="card">
  <app-header></app-header>
  <div class="card-view">
    <div class="card-container">
      <header class="card-header">
        <app-checkbox [type]="1" [checked]="card.isCompleted" (click)="updateIsCompleted()"></app-checkbox>
        <input class="title-card" placeholder="Card title" [value]="card.title" (input)="updateTitle($event)">
        <app-btn-close [size]="'32px'" (click)="goBack()"></app-btn-close>
      </header>

      <div class="card-content">
        <ng-container [ngSwitch]="currentMode">
          <app-card-details [card]="card" [boardId]="boardId" *ngSwitchCase="'details'"></app-card-details>
          <app-card-users [card]="card" *ngSwitchCase="'users'"></app-card-users>
          <app-card-labels [card]="card" *ngSwitchCase="'labels'"></app-card-labels>
          <app-card-comments [card]="card" *ngSwitchCase="'comments'"></app-card-comments>
        </ng-container>
        <nav class="nav-bar">
          <button class="btn-option" (click)="setMode('details')" [class.active]="currentMode == 'details'">🏠 Details</button>
          <button class="btn-option" (click)="setMode('users')" [class.active]="currentMode == 'users'">👤 Users</button>
          <button class="btn-option" (click)="setMode('labels')" [class.active]="currentMode == 'labels'">🏷 Labels</button>
          <button class="btn-option" (click)="setMode('comments')" [class.active]="currentMode == 'comments'">💬 Comments</button>
          <button class="btn-delete" (click)="deleteCard()">Delete</button>
        </nav>
      </div>
    </div>
  </div>
</div>
