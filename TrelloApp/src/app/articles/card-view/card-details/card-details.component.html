<div class="card-details">
  <section class="labels" *ngIf="labels.length > 0">
    <h2>Labels</h2>
    <ul>
      <li *ngFor="let label of labels">
        <button [style.background]="label.color">{{ label.name }}</button>
      </li>
    </ul>
  </section>

  <section class="users" *ngIf="users.length > 0">
    <h2>Users</h2>
    <ul>
      <li *ngFor="let user of users">
        <button>{{ user.name.charAt(1) }}</button>
      </li>
    </ul>
  </section>

  <section class="description">
    <button *ngIf="!isDescriptionActive" (click)="isDescriptionActive = true">Add a card description</button>
    <textarea *ngIf="isDescriptionActive" placeholder="Card description">Description</textarea>
  </section>
</div>
